{% extends "chores/base.html" %}

{% block title %}Login — Household Chores{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
            <h2>Sign In</h2>
            <p style="margin-bottom: 0;">Access your household chore board</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem;">
            No account yet? <a href="{% url 'chores:register' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
