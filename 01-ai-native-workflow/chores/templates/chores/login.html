{% extends "chores/base.html" %}

{% block title %}Login — Household Chores{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
    {% endif %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p>No account yet? <a href="{% url 'chores:register' %}">Register</a></p>
{% endblock %}
