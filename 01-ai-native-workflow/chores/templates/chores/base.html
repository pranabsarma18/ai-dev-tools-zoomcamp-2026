<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Household Chores{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        {% if user.is_authenticated %}
            | <a href="{% url 'chores:dashboard' %}">Dashboard</a>
            | Logged in as <strong>{{ user.username }}</strong>
            | <form method="post" action="{% url 'chores:logout' %}" style="display:inline">
                  {% csrf_token %}
                  <button type="submit">Logout</button>
              </form>
        {% else %}
            | <a href="{% url 'chores:login' %}">Login</a>
            | <a href="{% url 'chores:register' %}">Register</a>
        {% endif %}
    </nav>
    <hr>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
