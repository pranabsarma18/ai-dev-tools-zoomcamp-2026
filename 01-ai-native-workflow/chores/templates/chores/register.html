{% extends "chores/base.html" %}

{% block title %}Register — Household Chores{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">✨</div>
            <h2>Create an Account</h2>
            <p style="margin-bottom: 0;">Get started with shared household chores</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem;">
            Already have an account? <a href="{% url 'chores:login' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
