{% extends "chores/base.html" %}

{% block title %}Register — Household Chores{% endblock %}

{% block content %}
<h2>Create an Account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'chores:login' %}">Login</a></p>
{% endblock %}
