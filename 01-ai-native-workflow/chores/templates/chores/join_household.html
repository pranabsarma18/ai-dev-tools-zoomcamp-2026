{% extends "chores/base.html" %}

{% block title %}Join a Household — Household Chores{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="margin-bottom: 1.5rem;">
            <div>
                <h2>Join a Household</h2>
                <p style="margin-bottom: 0;">Enter an invite code provided by a household owner</p>
            </div>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                <strong>{{ error }}</strong>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Join Household</button>
                <a href="{% url 'chores:dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
